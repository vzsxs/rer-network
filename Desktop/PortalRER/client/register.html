<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Portal RER</title>

    <link rel="icon" href="/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/register.css">

</head>

<body>

<header class="navbar">
    <div class="logo">Portal RER</div>
</header>

<div class="breadcrumb"><a href="index.html">Inicio</a></div>

<h1 class="titulo-pagina">Registro</h1>

<div class="form-wrapper">

    <form id="registerForm" class="form-card">

        <div class="form-row">
            <div class="form-label">
                <label>Nombre de usuario:</label>
                <span class="requerido">Obligatorio</span>
            </div>
            <div class="form-input">
                <input type="text" id="nombre" placeholder="Ej: Juan" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-label">
                <label>Correo electrónico:</label>
                <span class="requerido">Obligatorio</span>
            </div>
            <div class="form-input">
                <input type="email" id="email" placeholder="correo@ejemplo.com" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-label">
                <label>Contraseña:</label>
                <span class="requerido">Obligatorio</span>
            </div>
            <div class="form-input">
                <input type="password" id="password" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-label">
                <label>Confirmar contraseña:</label>
                <span class="requerido">Obligatorio</span>
            </div>
            <div class="form-input">
                <input type="password" id="confirmPassword" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-label">
                <label>Código de invitación:</label>
                <span class="requerido">Obligatorio</span>
            </div>
            <div class="form-input">
                <input type="text" id="inviteCode" placeholder="RER2026" required>
            </div>
        </div>

        <div class="form-row form-row-final">
            <div class="form-label"></div>
            <div class="form-input">
                <button type="submit" class="btn-registrar">Registrarse</button>
                <p id="mensaje"></p>
                <a href="login.html" class="link-login">← Ya tengo una cuenta</a>
            </div>
        </div>

    </form>

</div>

<script src="js/register.js"></script>

</body>

</html>
