<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grupo - Portal RER</title>

<link rel="icon" href="/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/group.css">

</head>

<body>

<header class="navbar">
    <div class="logo">Portal RER</div>
    <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="foro.html">Foro</a>
        <a href="foro.html?tab=miembros">Miembros</a>
        <a href="groups.html" class="active">Grupos</a>
        <a href="noticias.html">Noticias</a>
        <a href="perfil.html">Perfil</a>
    </nav>
</header>

<div class="breadcrumb">
    <strong>Inicio</strong> › <a href="groups.html">Grupos</a> › <strong id="breadcrumbGrupo">Cargando...</strong>
</div>

<div class="layout">

    <!-- SIDEBAR: OTRAS ORGANIZACIONES -->
    <div>
        <div class="sidebar-box">
            <div class="sidebar-box-header">Organizaciones</div>
            <div class="sidebar-box-body" id="listaGrupos">
                <p style="padding:14px;font-size:12px;color:#7a7d84;">Cargando...</p>
            </div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div>

        <img class="grupo-banner" id="bannerGrupo" src="" alt="">

        <div class="grupo-header">

            <img class="grupo-header-icono" id="iconoGrupo" src="" alt="">

            <div class="grupo-header-info">
                <h1 id="nombreGrupo">Cargando...</h1>
                <div class="grupo-header-meta" id="metaGrupo"></div>
            </div>

            <div id="accionMembresia"></div>

        </div>

        <div class="tabs">
            <button class="tab activo" onclick="mostrarTab('info', this)">Información</button>
            <button class="tab" onclick="mostrarTab('anuncios', this)">Anuncios</button>
            <button class="tab" onclick="mostrarTab('materiales', this)">Equipamiento</button>
            <button class="tab" onclick="mostrarTab('miembros', this)">Miembros</button>
            <button class="tab" disabled title="Próximamente">Foro del grupo</button>
        </div>

        <!-- TAB: INFORMACIÓN -->
        <div id="tabInfo">

            <div class="panel">
                <div class="panel-header">Descripción</div>
                <div class="panel-body" id="descripcionGrupo">Cargando...</div>
            </div>

            <div class="panel">
                <div class="panel-header">Reglamento</div>
                <div class="panel-body" id="reglamentoGrupo">
                    <p class="vacio">Cargando...</p>
                </div>
            </div>

        </div>

        <!-- TAB: ANUNCIOS -->
        <div id="tabAnuncios" style="display:none;">
            <div class="panel">
                <div class="panel-header">Anuncios del grupo</div>
                <div id="listaAnuncios">
                    <div class="panel-body"><p class="vacio">Cargando...</p></div>
                </div>
            </div>
        </div>

        <!-- TAB: EQUIPAMIENTO -->
        <div id="tabMateriales" style="display:none;">
            <div class="panel">
                <div class="panel-header">Equipamiento del grupo</div>
                <div id="listaEquipamiento">
                    <div class="panel-body"><p class="vacio">Cargando...</p></div>
                </div>
            </div>
        </div>

        <!-- TAB: MIEMBROS -->
        <div id="tabMiembros" style="display:none;">
            <div class="panel">
                <div class="panel-header">Miembros del grupo</div>
                <div id="listaMiembros">
                    <div class="panel-body"><p class="vacio">Cargando...</p></div>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="js/group.js"></script>

</body>
</html>
